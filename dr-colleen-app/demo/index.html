          position: relative;

          border-radius: 36px;

          box-shadow:
            0 30px 60px -20px rgba(0, 0, 0, 0.35),
            0 8px 24px -8px rgba(0, 0, 0, 0.18);
          overflow: hidden;
          isolation: isolate;
          /* Anything position:fixed inside the app stays inside the frame. */
          transform: translateZ(0);
        }
        .device-shell::after {
          content: "";
          position: absolute;
          inset: 0;
          border: 8px solid #2d2d2d;
          border-radius: 36px;

  <body>
    <noscript>You need to enable JavaScript to run this demo.</noscript>
    <div class="device-shell">
      <div id="root"></div>
    </div>
    <script>
      // Menus, sheets and dialogs are portaled onto <body>; add them to the
      // phone frame instead (its transform contains position:fixed), and let
      // their removal find them there.
      (function () {
        var body = document.body;
        var shell = document.querySelector(".device-shell");
        var append = body.appendChild.bind(body);
        var remove = body.removeChild.bind(body);
        body.appendChild = function (n) {
          return n && n.nodeType === 1 && n.tagName === "DIV" && n !== shell ? shell.appendChild(n) : append(n);
        };
        body.removeChild = function (n) {
          return n && n.parentNode && n.parentNode !== body ? n.parentNode.removeChild(n) : remove(n);
        };
      })();
    </script>
